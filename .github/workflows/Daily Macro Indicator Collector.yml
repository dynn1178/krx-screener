name: 매크로 지표 수집
on:
  schedule:
    - cron: "0 9 * * 1-5"   # 18:00 KST
  workflow_dispatch:

concurrency:
  group: macro-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r collector/requirements.txt

      - name: 수집 실행
        env:
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY:          ${{ secrets.ECOS_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:          ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collector/collect_macro.py
