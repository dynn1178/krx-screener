name: KRX 데이터 수집

on:
  schedule:
    # 18:00 KST
    - cron: "0 9 * * 1-5"
  workflow_dispatch:            # 수동 실행 버튼
    inputs:
      mode:
        description: "수집 모드"
        required: true
        default: "daily"
        type: choice
        options: [daily, backfill, master]
      days:
        description: "backfill 기간(일)"
        required: false
        default: "400"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r collector/requirements.txt

      - name: 수집 실행
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DART_API_KEY:         ${{ secrets.DART_API_KEY }}
          KRX_ID:               ${{ secrets.KRX_ID }}
          KRX_PW:               ${{ secrets.KRX_PW }}
        run: |
          python collector/collect.py \
            --mode ${{ inputs.mode || 'daily' }} \
            --days ${{ inputs.days || '400' }}
